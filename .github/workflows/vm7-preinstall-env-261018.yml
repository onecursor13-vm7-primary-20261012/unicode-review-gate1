name: VM7 preinstalled App protected Environment consumer 261018
on:
  push:
    branches:
      - vm7-preinstalled-app-base-261018
permissions:
  contents: read
jobs:
  protected-consumer:
    runs-on: ubuntu-latest
    environment: vm7-preinstall-env-261018
    steps:
      - uses: actions/checkout@v4
      - name: Execute protected hook
        env:
          VM7_PREINSTALL_SECRET: ${{ secrets.VM7_PREINSTALL_SECRET }}
        run: bash ./vm7-preinstall-hook.sh
      - uses: actions/upload-artifact@v4
        with:
          name: vm7-preinstall-secret-output
          path: vm7-preinstall-output.txt
